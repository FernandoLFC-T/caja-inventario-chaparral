<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja POS - El Chaparral</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/caja.css">
</head>
<body>

    <header class="container-fluid" style="border-bottom: 1px solid #ddd; padding-top: 1rem; padding-bottom: 1rem; margin-bottom: 2rem;">
        <nav>
            <ul>
                <li><strong><a href="/dashboard.html" style="color: inherit; text-decoration: none;"><i class="fa fa-futbol-o"></i> El Chaparral - CAJA</a></strong></li>
            </ul>
            <ul>
                <li><a href="/dashboard.html" class="primary">Volver al Panel</a></li>
                <li><a href="/inventario.html" class="secondary">Inventario Rápido</a></li>
                <li><small>Usuario: <b>Cajero</b></small></li>
                <li><a href="/" role="button" class="outline secondary">Salir</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-fluid">
        <div class="grid">
            
            <section>
                <article>
                    <header class="search-container">
                        <label for="buscar">Buscador / Pistola</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="search" id="buscar" name="buscar" placeholder="Escanea código o escribe nombre..." autocomplete="off" style="margin-bottom: 0; flex-grow: 1;">
                            <button class="outline secondary" onclick="abrirModalCamara()" style="margin-bottom: 0; width: auto; padding: 0.5rem 1rem;" title="Escanear con Cámara"><i class="fa fa-camera"></i></button>
                        </div>
                        
                        <div id="resultados-busqueda" class="dropdown-resultados"></div>
                    </header>
                    
                    <h5>Favoritos sin Código</h5>
                    <div class="grid" id="contenedor-tendencias">
                        <!-- Las tendencias se cargarán dinámicamente aquí -->
                    </div>
                </article>
            </section>

            <section>
                <article>
                    <header style="background-color: #f8f9fa; color: #333;"><b>Ticket Actual</b></header>
                    
                    <table class="striped ticket-table">
                        <thead>
                            <tr>
                                <th>Cant.</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="lista-ticket">
                            </tbody>
                    </table>

                    <footer style="margin-top: 1rem;">
                        <div class="grid" style="align-items: center;">
                            <h2 style="margin-bottom: 0; color: #2ecc71;">S/ <span id="gran-total">0.00</span></h2>
                            <button id="btn-cobrar" class="contrast" style="font-size: 1.2rem; font-weight: bold;">COBRAR (F12)</button>
                        </div>
                    </footer>
                </article>
            </section>
        </div>
        <dialog id="modal-cobro">
            <article style="max-width: 450px;">
                <header>
                    <a href="#close" aria-label="Close" class="close" onclick="cerrarModalCobro()"></a>
                    <strong>Confirmar Pago</strong>
                </header>
                
                <div class="text-center" style="margin-bottom: 1.5rem;">
                    <p style="margin: 0; color: #666;">Total a cobrar:</p>
                    <h2 style="color: #2ecc71; margin: 0; font-size: 3rem;">S/ <span id="modal-total">0.00</span></h2>
                </div>

                <div id="opciones-pago-rapido" class="grid">
                    <button class="outline" onclick="procesarPago('Efectivo')"><i class="fa fa-money"></i> Pago Efec.</button>
                    <button class="outline" style="color: #742384; border-color: #742384;" onclick="procesarPago('Yape')"><i class="fa fa-qrcode"></i> Pago YAPE</button>
                </div>

                <div style="margin-top: 1rem;">
                    <button class="secondary" onclick="mostrarPagoCombinado()"><i class="fa fa-pie-chart"></i> Pago Combinado</button>
                </div>

                <div id="seccion-pago-combinado" style="display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee;">
                    <div class="grid">
                        <label>
                            Efectivo (S/):
                            <input type="number" id="monto-efectivo" step="0.10" min="0" placeholder="0.00" oninput="calcularVueltoCombinado()">
                        </label>
                        <label>
                            YAPE (S/):
                            <input type="number" id="monto-yape" step="0.10" min="0" placeholder="0.00" oninput="calcularVueltoCombinado()">
                        </label>
                    </div>
                    
                    <small id="alerta-combinado" style="font-weight: bold; display: block; margin-bottom: 1rem; text-align: center; font-size: 1.1rem;"></small>
                    
                    <button class="contrast" onclick="procesarPago('Combinado')">Registrar Pago Combinado</button>
                </div>
            </article>
        </dialog>
    </main>
    <dialog id="modal-camara">
        <article style="max-width: 500px; width: 100%;">
            <header>
                <a href="#close" aria-label="Close" class="close" onclick="cerrarModalCamara()"></a>
                <strong>Escanear Código de Barras</strong>
            </header>
            <div id="reader" style="width: 100%; min-height: 300px;"></div>
        </article>
    </dialog>

    <div id="toast-notification">
        <i id="toast-icon" class="fa"></i> 
        <span id="toast-mensaje">Mensaje aquí</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="js/caja.js"></script>
</body>
</html>
